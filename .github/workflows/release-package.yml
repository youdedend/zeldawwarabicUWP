name: Publish release (package + source)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Attach the latest Arabic package to a GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Download the latest fast-lane package artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          RUN=$(gh run list --workflow "Fast package (from upstream release)" -b "${GITHUB_REF_NAME}" --limit 20 \
                 --json databaseId,conclusion --jq '[.[] | select(.conclusion == "success")][0].databaseId')
          echo "Fast run: $RUN"
          gh run download "$RUN" -n wwhd-uwp-arabic-fast-appx -D assets
          ls -la assets

      - name: Create the release with the package attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="arabic-v0.1.0"
          NOTES=$(cat <<'EOF'
          WWHD-UWP **Arabic Edition** - self-contained UWP package built on GitHub Actions.

          ## What is inside
          - `wwhd-uwp-arabic.appx` - signed package: JYRS20 WWHD-UWP v0.1.2 runtime + the bundled
            Arabic Hesham (موقظ الرياح) translation mod + the native Windfall pirate-door riddle
            bypass + the RTL text engine (activates automatically from the Arabic font).
          - `wwhd-uwp-arabic.pfx` / `wwhd-uwp-arabic.cer` - the self-signing certificate
            (CN=WWHDRecompDevelopment, PFX password: `wwhd-uwp-arabic`).
          - `wwhd-uwp-arabic-unsigned.appx` - the same package before signing.

          ## Install (Windows)
          1. Install `wwhd-uwp-arabic.cer` into *Trusted People* (Local Machine).
          2. Double-click `wwhd-uwp-arabic.appx` (or `Add-AppxPackage .\wwhd-uwp-arabic.appx`).

          ## Install (Xbox Dev Mode)
          1. Install `wwhd-uwp-arabic.cer` on the console via the Device Portal.
          2. Deploy `wwhd-uwp-arabic.appx` via the Device Portal (*Home > Games & apps*).

          ## Enable the Arabic translation
          Open *Settings -> Mods* in-game once and enable **Arabic Hesham** if it is not already
          active. The RTL text engine switches on automatically.

          ## Source code
          The `Source code (zip)` and `Source code (tar.gz)` links below are the complete
          source tree for this package (runtime edits, mod tooling, build workflows and scripts).
          EOF
          )
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
            echo "Release $TAG updated"
          else
            gh release create "$TAG" assets/* \
              --target "${GITHUB_REF_NAME}" \
              --title "WWHD-UWP Arabic Edition v0.1.0" \
              --notes "$NOTES"
            echo "Release $TAG created"
          fi
